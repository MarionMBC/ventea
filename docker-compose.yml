services:
  postgres:
    image: postgres:16-alpine
    container_name: ventea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ventea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventea_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ventea}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ventea-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ventea} -d ${POSTGRES_DB:-ventea}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ventea-pgdata:
