# Panel administrativo en /admin/ (apps/admin): staff de cada marca y, en
# /admin/plataforma, el panel de la plataforma. Lo incluyen los server blocks de
# deploy/nginx.conf (marcas y apex); se copia a /etc/nginx/ventea/ (NO a conf.d, que
# nginx carga entero a nivel http).

# Los sourcemaps no se publican (build con sourcemap 'hidden'); si alguno quedara, 404.
location ~ ^/admin/.*\.map$ {
  return 404;
}

# Assets con hash en el nombre: cache para siempre.
location /admin/assets/ {
  alias /usr/share/nginx/html/admin/assets/;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# `/admin` exacto → `/admin/`. Prefijo con barra: `/adminx` no es el panel.
location = /admin {
  return 301 /admin/;
}

# El panel (SPA). Va antes que el catch-all; su index.html no se cachea.
location /admin/ {
  alias /usr/share/nginx/html/admin/;
  try_files $uri $uri/ /admin/index.html;
  add_header Cache-Control "no-cache";
}
