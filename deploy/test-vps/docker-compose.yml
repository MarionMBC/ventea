# Ventea backend - instancia de PRUEBA en la VPS compartida de VIAJU.
# Sin Caddy: el Traefik de Dokploy termina TLS. Postgres sin puerto al host.
name: ventea-test
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: ${IMAGE_API}
    restart: 'no'
    user: '0' # prisma migrate escribe en node_modules/@prisma/engines
    working_dir: /app/apps/api
    command: ['../../node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: { DATABASE_URL: '${DATABASE_URL}' }
    networks: [internal]
    depends_on: { postgres: { condition: service_healthy } }
  api:
    image: ${IMAGE_API}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TENANT_MODE: ${TENANT_MODE}
      TENANT_SLUG: ${TENANT_SLUG}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
      PUBLIC_ORIGIN: https://${HOST}
    networks: [internal, dokploy-network]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
networks:
  internal:
  dokploy-network: { external: true }
volumes:
  pgdata:
