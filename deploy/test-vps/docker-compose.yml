# Ventea - instancia de PRUEBA en la VPS compartida de VIAJU: API + web (panel en /admin).
# Sin Caddy: el Traefik de Dokploy termina TLS. Postgres sin puerto al host.
name: ventea-test
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: ${IMAGE_API}
    restart: 'no'
    user: '0' # prisma migrate escribe en node_modules/@prisma/engines
    working_dir: /app/apps/api
    command: ['../../node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: { DATABASE_URL: '${DATABASE_URL}' }
    networks: [internal]
    depends_on: { postgres: { condition: service_healthy } }
  api:
    image: ${IMAGE_API}
    restart: unless-stopped
    # El apagado espera hasta 35 s la corrida de cobro en curso (BillingScheduler): sin esto,
    # Docker mata el proceso a los 10 s y el cobro en vuelo queda para conciliar a mano.
    stop_grace_period: 40s
    # Techo de memoria (TASK-016): el procesamiento de imágenes (sharp) pide RAM fuera del heap
    # de Node; con el tope, un abuso reinicia la API en vez de tumbar la VPS compartida.
    mem_limit: 768m
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TENANT_MODE: ${TENANT_MODE}
      TENANT_SLUG: ${TENANT_SLUG}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
      PUBLIC_ORIGIN: https://${HOST}
      # SaaS (TASK-004). Opcionales: vacías = default (región hn-1, 5 registros/hora por IP,
      # cupo global 10 altas/día y 25/semana).
      REGIONS: ${REGIONS:-}
      SIGNUP_RATE_LIMIT_PER_HOUR: ${SIGNUP_RATE_LIMIT_PER_HOUR:-}
      SIGNUP_DAILY_LIMIT: ${SIGNUP_DAILY_LIMIT:-}
      SIGNUP_WEEKLY_LIMIT: ${SIGNUP_WEEKLY_LIMIT:-}
      # Cobro (TASK-005). Sin credenciales de CyberSource en esta VPS: manual.
      BILLING_MODE: ${BILLING_MODE:-manual}
      MS_PAYMENTS_URL: ${MS_PAYMENTS_URL:-}
      MS_PAYMENTS_KEY: ${MS_PAYMENTS_KEY:-}
      MS_PAYMENTS_PROVIDER: ${MS_PAYMENTS_PROVIDER:-}
      BILLING_CYCLE_INTERVAL_MINUTES: ${BILLING_CYCLE_INTERVAL_MINUTES:-}
      # Medios y push (TASK-016). MEDIA_DIR es el volumen `media` (entra en el respaldo).
      # Opcionales: cuota 200 MB por marca, 60 subidas/hora por marca, base = host del request.
      MEDIA_DIR: /data/media
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-}
      MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR: ${MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_PROCESSING_CONCURRENCY: ${MEDIA_PROCESSING_CONCURRENCY:-}
      MEDIA_PROCESSING_WAIT_MS: ${MEDIA_PROCESSING_WAIT_MS:-}
      # 32 bytes (openssl rand -base64 32). Vacía = push apagado (no se aceptan credenciales).
      # Perderla deja ilegibles las credenciales FCM guardadas: va al gestor de secretos.
      PUSH_CREDENTIALS_KEY: ${PUSH_CREDENTIALS_KEY:-}
      # Correos (TASK-021). SMTP_URL vacía = no se envía nada: la outbox registra `skipped`.
      # Lleva la clave del SMTP: va al gestor de secretos. Ver docs/deployment.md#correos.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PLATFORM_ALERT_EMAILS: ${PLATFORM_ALERT_EMAILS:-}
      MAIL_RATE_LIMIT_PER_MINUTE: ${MAIL_RATE_LIMIT_PER_MINUTE:-}
      LIFECYCLE_EMAILS_INTERVAL_MINUTES: ${LIFECYCLE_EMAILS_INTERVAL_MINUTES:-}
    volumes: [media:/data/media]
    networks: [internal, dokploy-network]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  # Estáticos (nginx): panel de staff en /admin y build web de apps/mobile en /.
  # Traefik le manda todo `<slug>.ventea.tech` salvo /api (ver sync-routes.sh), así que
  # el panel llama a la API en su mismo origen. El nombre del contenedor
  # (ventea-test-web-1) es el upstream de la ruta.
  # Sin IMAGE_WEB todo el proyecto compose es inválido (también los `compose exec` de
  # sync-routes.sh y new-tenant.sh): mejor fallar con un mensaje claro.
  web:
    image: ${IMAGE_WEB:?falta IMAGE_WEB en .env}
    restart: unless-stopped
    networks: [dokploy-network]
networks:
  internal:
  dokploy-network: { external: true }
volumes:
  pgdata:
  media: # imágenes de las marcas (TASK-016): respaldarlo junto con la base
