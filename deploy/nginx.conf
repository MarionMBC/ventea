# Un contenedor, cuatro sitios decididos por el header Host (TASK-006, TASK-007, TASK-008):
#
#   ventea.tech          → sitio corporativo bilingüe (apps/site, TASK-009/TASK-014): inglés
#                          por defecto en / y /privacy, español en /es/ y
#                          /es/politica-de-privacidad; 404 propio por idioma. Rutas de TASK-009
#                          → 301: /en/* → /*, /politica-de-privacidad → /es/politica-de-privacidad.
#                          Las rutas del SaaS que vivieron en el apex (/registro, /terminos,
#                          /privacidad, /precios, /admin*, /plataforma) → 301 a su ruta canónica
#                          en app. con la query; /api → 308 a app. (compatibilidad)
#   www.ventea.tech      → 301 a https://ventea.tech, conservando ruta y query
#   app.ventea.tech      → landing + registro + legales (apps/landing) en /, panel de
#                          plataforma en /admin/plataforma (/plataforma y /admin/ redirigen ahí)
#   <slug>.ventea.tech   → menú público (build web de apps/mobile) en /, panel de staff en
#                          /admin/; /admin/plataforma → a app. (el token de plataforma no
#                          vive en el origen de una marca). Server por defecto: cualquier
#                          otro host cae acá. `app` es un slug reservado (@ventea/shared).
#
# El dominio está fijo acá (`ventea.tech`), igual que TENANT_BASE_DOMAIN en el .env de la
# VPS: si cambia uno, cambia el otro.
#
# /api no llega a nginx: Traefik lo manda a la API (deploy/test-vps/sync-routes.sh).
# Headers de seguridad: deploy/nginx-security-headers.conf, en cada server y en cada
# location con `add_header` propio.
#
# Detrás de un proxy TLS (Traefik/Caddy) nginx escucha en http:80: las redirecciones
# (p. ej. /admin -> /admin/) van relativas para no saltar a http://host:80.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ── Marcas (y cualquier host no listado) ─────────────────────────────────
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  # Los sourcemaps se generan en el build pero no se publican (igual que en app. y el apex).
  location ~ ^/.*\.map$ {
    return 404;
  }

  # Los assets llevan hash en el nombre: se cachean para siempre sin riesgo de
  # servir una version vieja tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # El panel de plataforma solo existe en app.ventea.tech. Regex sin distinguir mayúsculas
  # (/ADMIN/Plataforma también), y antes que las locations de /admin/ del include.
  location ~* ^/admin/plataforma {
    return 301 https://app.ventea.tech/admin/plataforma;
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # index.html NUNCA se cachea: es el archivo que apunta a los assets nuevos.
  # Si se cachea, el navegador sigue pidiendo el bundle viejo despues del deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# ── app.ventea.tech: landing, registro, legales y panel de plataforma ─────
server {
  listen 80;
  server_name app.ventea.tech;

  root /usr/share/nginx/landing;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  location ~ ^/.*\.map$ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Acá no hay marca: el panel de staff no sirve. Su raíz va al de plataforma.
  location = /admin/ {
    return 302 /admin/plataforma;
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # Atajo al panel de plataforma.
  location = /plataforma {
    return 301 /admin/plataforma;
  }

  # Español (TASK-012): /es/ → /es/index.html (head, lang y canonical en español). Lo que no
  # existe bajo /es/ cae en la home ES, no en la EN de `/` (sin head EN en una URL /es/…).
  location ^~ /es/ {
    try_files $uri $uri/index.html /es/index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Cada ruta tiene su index.html con su <head> (seo-plugin del build de apps/landing):
  # /terminos → /terminos/index.html. Lo que no existe cae en el de `/`. No se cachea.
  location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# /en/<x> (inglés bajo /en/ en TASK-009) → /<x>, con la query. Se arma desde $request_uri (sin
# decodificar: un %0d%0a no parte el header Location). Si tras /en/ viene otra barra o una barra
# invertida (`/en//evil.test` o `/en/\evil.test` darían `//evil.test` o `/\evil.test`, que el
# navegador resuelve a otro host) → `/`. La barra invertida va como `\x5c`: dentro de comillas
# nginx convierte `\\` en `\` y la clase quedaría `[^/\?]` (sin excluir `\`). Lo prueba
# deploy/test-vps/nginx-smoke.mjs con bytes crudos por socket (curl convierte `\` en `/`).
map $request_uri $ventea_en_target {
  default /;
  "~^/en/(?<en_rest>[^/\x5c?][^?]*)?(?<en_query>\?.*)?$" /$en_rest$en_query;
}

# ── ventea.tech: sitio corporativo (apps/site, TASK-008/009/014) ──────────
server {
  listen 80;
  server_name ventea.tech;

  root /usr/share/nginx/site;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  location ~ ^/.*\.map$ {
    return 404;
  }

  # Rutas del SaaS que vivieron en el apex hasta TASK-007 (links ya compartidos): 301 a su ruta
  # canónica (en minúsculas) en app., con la query. Sin distinguir mayúsculas: `/REGISTRO` iría a
  # `app./REGISTRO`, que la landing no conoce. Los destinos van fijos (nunca una captura del path
  # decodificado: un `%0d%0a` partiría el header Location); `$args` viaja sin decodificar.
  location ~* ^/registro/?$ {
    return 301 https://app.ventea.tech/registro$is_args$args;
  }
  location ~* ^/terminos/?$ {
    return 301 https://app.ventea.tech/terminos$is_args$args;
  }
  location ~* ^/privacidad/?$ {
    return 301 https://app.ventea.tech/privacidad$is_args$args;
  }
  # app. no tiene /precios: los precios son la sección #precios de la landing. Los links viejos
  # a /precios eran para público en español: van a la landing ES (/es/; / es inglés, TASK-012).
  location ~* ^/precios/?$ {
    return 301 https://app.ventea.tech/es/$is_args$args#precios;
  }
  # Panel de plataforma (y /admin, /plataforma y sus subrutas): a su entrada en app.
  location ~* ^/(admin|plataforma)(/|$) {
    return 301 https://app.ventea.tech/admin/plataforma$is_args$args;
  }

  # /api se enrutaba en el apex hasta TASK-007. El sitio no usa API: un cliente viejo va a app.
  # 308 (no 301) para que un POST siga siendo POST con su cuerpo.
  location = /api {
    return 308 https://app.ventea.tech$request_uri;
  }
  location ^~ /api/ {
    return 308 https://app.ventea.tech$request_uri;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # TASK-014: inglés por defecto. Rutas de TASK-009 (links ya publicados) → 301 con la query.
  # /en, /en/ → /; /en/<x> → /<x> (map de arriba). Los 301 nuevos llevan max-age de 1 día: un
  # 301 sin Cache-Control queda en la caché del navegador para siempre y el próximo cambio de
  # rutas quedaría fijado (es lo que pasa con /privacy → /en/privacy de TASK-009, ver abajo).
  location = /en {
    add_header Cache-Control "max-age=86400" always;
    include /etc/nginx/ventea/security-headers.conf;
    return 301 /$is_args$args;
  }
  location ^~ /en/ {
    add_header Cache-Control "max-age=86400" always;
    include /etc/nginx/ventea/security-headers.conf;
    return 301 $ventea_en_target;
  }
  # SIN redirección: TASK-009 publicó `/privacy` → 301 `/en/privacy` sin Cache-Control y los
  # navegadores lo guardan sin vencimiento. Si `/en/privacy` redirigiera a `/privacy`, quien ya
  # visitó `/privacy` entraría en bucle (ERR_TOO_MANY_REDIRECTS). Se sirve la misma página EN;
  # su canonical apunta a `/privacy`, así que el SEO no cambia.
  location = /en/privacy {
    try_files /privacy/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
  location = /en/privacy/ {
    try_files /privacy/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
  # La privacidad en español pasó a /es/. NO puede ser /privacidad (redirige a app., arriba).
  location ~* ^/politica-de-privacidad/?$ {
    add_header Cache-Control "max-age=86400" always;
    include /etc/nginx/ventea/security-headers.conf;
    return 301 /es/politica-de-privacidad$is_args$args;
  }

  # /es sin barra → /es/ (la URL canónica de la home en español).
  location = /es {
    add_header Cache-Control "max-age=86400" always;
    include /etc/nginx/ventea/security-headers.conf;
    return 301 /es/$is_args$args;
  }

  # Español: cada ruta tiene su index.html prerenderizado (scripts/prerender.mjs de apps/site):
  # /es/ → /es/index.html, /es/politica-de-privacidad → …/index.html. Lo que no existe → 404 ES.
  location ^~ /es/ {
    try_files $uri $uri/index.html =404;
    error_page 404 /es/404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Pedida directo, /es/404.html es interna → 404, que se resuelve con la página ES (no la EN
  # del server). `always`: el 404 también lleva Cache-Control.
  location = /es/404.html {
    internal;
    error_page 404 /es/404.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Recursos de marca y favicon (sin hash en el nombre): caché corta y revalidación.
  location ^~ /brand/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Inglés (por defecto): cada ruta tiene su index.html prerenderizado: / → /index.html,
  # /privacy → /privacy/index.html. Lo que no existe → 404 real con la página propia en inglés
  # (noindex). No se cachea.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# ── www → apex (301 con ruta y query) ────────────────────────────────────
server {
  listen 80;
  server_name www.ventea.tech;
  include /etc/nginx/ventea/security-headers.conf;
  return 301 https://ventea.tech$request_uri;
}
