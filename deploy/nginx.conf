# Un contenedor, cuatro sitios decididos por el header Host (TASK-006, TASK-007, TASK-008):
#
#   ventea.tech          → sitio corporativo (apps/site, en inglés): /, /privacy y 404 propio.
#                          Las rutas del SaaS que vivieron en el apex (/registro, /terminos,
#                          /privacidad, /precios, /admin*, /plataforma) → 301 a su ruta canónica
#                          en app. con la query; /api → 308 a app. (compatibilidad)
#   www.ventea.tech      → 301 a https://ventea.tech, conservando ruta y query
#   app.ventea.tech      → landing + registro + legales (apps/landing) en /, panel de
#                          plataforma en /admin/plataforma (/plataforma y /admin/ redirigen ahí)
#   <slug>.ventea.tech   → menú público (build web de apps/mobile) en /, panel de staff en
#                          /admin/; /admin/plataforma → a app. (el token de plataforma no
#                          vive en el origen de una marca). Server por defecto: cualquier
#                          otro host cae acá. `app` es un slug reservado (@ventea/shared).
#
# El dominio está fijo acá (`ventea.tech`), igual que TENANT_BASE_DOMAIN en el .env de la
# VPS: si cambia uno, cambia el otro.
#
# /api no llega a nginx: Traefik lo manda a la API (deploy/test-vps/sync-routes.sh).
# Headers de seguridad: deploy/nginx-security-headers.conf, en cada server y en cada
# location con `add_header` propio.
#
# Detrás de un proxy TLS (Traefik/Caddy) nginx escucha en http:80: las redirecciones
# (p. ej. /admin -> /admin/) van relativas para no saltar a http://host:80.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ── Marcas (y cualquier host no listado) ─────────────────────────────────
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  # Los assets llevan hash en el nombre: se cachean para siempre sin riesgo de
  # servir una version vieja tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # El panel de plataforma solo existe en app.ventea.tech. Regex sin distinguir mayúsculas
  # (/ADMIN/Plataforma también), y antes que las locations de /admin/ del include.
  location ~* ^/admin/plataforma {
    return 301 https://app.ventea.tech/admin/plataforma;
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # index.html NUNCA se cachea: es el archivo que apunta a los assets nuevos.
  # Si se cachea, el navegador sigue pidiendo el bundle viejo despues del deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# ── app.ventea.tech: landing, registro, legales y panel de plataforma ─────
server {
  listen 80;
  server_name app.ventea.tech;

  root /usr/share/nginx/landing;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  location ~ ^/.*\.map$ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Acá no hay marca: el panel de staff no sirve. Su raíz va al de plataforma.
  location = /admin/ {
    return 302 /admin/plataforma;
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # Atajo al panel de plataforma.
  location = /plataforma {
    return 301 /admin/plataforma;
  }

  # Cada ruta tiene su index.html con su <head> (seo-plugin del build de apps/landing):
  # /terminos → /terminos/index.html. Lo que no existe cae en el de `/`. No se cachea.
  location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# ── ventea.tech: sitio corporativo (apps/site, TASK-008) ──────────────────
server {
  listen 80;
  server_name ventea.tech;

  root /usr/share/nginx/site;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/ventea/security-headers.conf;

  location ~ ^/.*\.map$ {
    return 404;
  }

  # Rutas del SaaS que vivieron en el apex hasta TASK-007 (links ya compartidos): 301 a su ruta
  # canónica (en minúsculas) en app., con la query. Sin distinguir mayúsculas: `/REGISTRO` iría a
  # `app./REGISTRO`, que la landing no conoce. Los destinos van fijos (nunca una captura del path
  # decodificado: un `%0d%0a` partiría el header Location); `$args` viaja sin decodificar.
  location ~* ^/registro/?$ {
    return 301 https://app.ventea.tech/registro$is_args$args;
  }
  location ~* ^/terminos/?$ {
    return 301 https://app.ventea.tech/terminos$is_args$args;
  }
  location ~* ^/privacidad/?$ {
    return 301 https://app.ventea.tech/privacidad$is_args$args;
  }
  # app. no tiene /precios: los precios son la sección #precios de la landing.
  location ~* ^/precios/?$ {
    return 301 https://app.ventea.tech/$is_args$args#precios;
  }
  # Panel de plataforma (y /admin, /plataforma y sus subrutas): a su entrada en app.
  location ~* ^/(admin|plataforma)(/|$) {
    return 301 https://app.ventea.tech/admin/plataforma$is_args$args;
  }

  # /api se enrutaba en el apex hasta TASK-007. El sitio no usa API: un cliente viejo va a app.
  # 308 (no 301) para que un POST siga siendo POST con su cuerpo.
  location = /api {
    return 308 https://app.ventea.tech$request_uri;
  }
  location ^~ /api/ {
    return 308 https://app.ventea.tech$request_uri;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/ventea/security-headers.conf;
  }

  # Cada ruta tiene su index.html con su <head> (seo-plugin de apps/site): /privacy →
  # /privacy/index.html. Lo que no existe → 404 real con la página propia (noindex). No se cachea.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    include /etc/nginx/ventea/security-headers.conf;
  }
}

# ── www → apex (301 con ruta y query) ────────────────────────────────────
server {
  listen 80;
  server_name www.ventea.tech;
  include /etc/nginx/ventea/security-headers.conf;
  return 301 https://ventea.tech$request_uri;
}
