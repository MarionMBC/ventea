# Un contenedor, tres sitios decididos por el header Host (TASK-006):
#
#   ventea.tech          → landing + registro (apps/landing) en /, panel en /admin/
#                          (el de plataforma: /admin/plataforma; /plataforma redirige)
#   www.ventea.tech      → 301 a https://ventea.tech
#   <slug>.ventea.tech   → menú público (build web de apps/mobile) en /, panel en /admin/
#                          (server por defecto: cualquier otro host cae acá)
#
# /api no llega a nginx: Traefik lo manda a la API (deploy/test-vps/sync-routes.sh).
#
# Detrás de un proxy TLS (Traefik/Caddy) nginx escucha en http:80: las redirecciones
# (p. ej. /admin -> /admin/) van relativas para no saltar a http://host:80.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ── Marcas (y cualquier host no listado) ─────────────────────────────────
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Los assets llevan hash en el nombre: se cachean para siempre sin riesgo de
  # servir una version vieja tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # index.html NUNCA se cachea: es el archivo que apunta a los assets nuevos.
  # Si se cachea, el navegador sigue pidiendo el bundle viejo despues del deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# ── Apex: landing y registro ─────────────────────────────────────────────
server {
  listen 80;
  server_name ventea.tech;

  root /usr/share/nginx/landing;
  index index.html;
  absolute_redirect off;

  location ~ ^/.*\.map$ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  include /etc/nginx/ventea/admin-locations.conf;

  # Atajo al panel de plataforma.
  location = /plataforma {
    return 301 /admin/plataforma;
  }

  # SPA: `/` y `/registro` sirven el mismo index.html; no se cachea.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# ── www → apex ───────────────────────────────────────────────────────────
server {
  listen 80;
  server_name www.ventea.tech;
  return 301 https://ventea.tech$request_uri;
}
