server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Detrás de un proxy TLS (Traefik/Caddy) nginx escucha en http:80: las redirecciones
  # (p. ej. /admin -> /admin/) van relativas para no saltar a http://host:80.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre: se cachean para siempre sin riesgo de
  # servir una version vieja tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Assets del panel: mismo criterio que /assets/ (hash en el nombre).
  location /admin/assets/ {
    alias /usr/share/nginx/html/admin/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El panel administrativo. Va antes que el catch-all de la SPA publica. Su
  # index.html tampoco se cachea (ver abajo).
  location /admin {
    alias /usr/share/nginx/html/admin;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
  }

  # index.html NUNCA se cachea: es el archivo que apunta a los assets nuevos.
  # Si se cachea, el navegador sigue pidiendo el bundle viejo despues del deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
