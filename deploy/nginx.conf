server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre: se cachean para siempre sin riesgo de
  # servir una version vieja tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El panel administrativo. Va antes que el catch-all de la SPA publica.
  location /admin {
    alias /usr/share/nginx/html/admin;
    try_files $uri $uri/ /admin/index.html;
  }

  # index.html NUNCA se cachea: es el archivo que apunta a los assets nuevos.
  # Si se cachea, el navegador sigue pidiendo el bundle viejo despues del deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
