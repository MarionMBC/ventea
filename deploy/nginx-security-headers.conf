# Headers de seguridad de todos los sitios del contenedor web (marcas, app., apex). Se incluye a
# nivel `server` Y en cada `location` que tiene su propio `add_header` (Cache-Control):
# nginx NO hereda los add_header del server en una location que define alguno.
#
# - frame-ancestors 'none' + X-Frame-Options DENY: nada se puede embeber (clickjacking del
#   panel de plataforma y del panel de staff).
# - CSP: todo sale del mismo origen. `style-src 'unsafe-inline'` lo exige Ionic (inyecta
#   <style> de sus componentes); scripts solo propios. `img-src https:` cubre los logos y
#   fotos de menú de cada marca (URLs externas); `data:` los SVG inline de la landing.
#   `connect-src 'self'`: todo llama a /api del mismo origen.
# - HSTS con subdominios: todo `*.ventea.tech` va por HTTPS (Traefik). Arranca en 30 días
#   (2592000): si algún subdominio resultara no tener HTTPS, el bloqueo dura poco. Tras
#   verificar en producción que todos responden por HTTPS, subir a 1 año (31536000).
add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
