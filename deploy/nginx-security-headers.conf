# Headers de seguridad de todos los sitios del contenedor web (marcas, apex). Se incluye a
# nivel `server` Y en cada `location` que tiene su propio `add_header` (Cache-Control):
# nginx NO hereda los add_header del server en una location que define alguno.
#
# - frame-ancestors 'none' + X-Frame-Options DENY: nada se puede embeber (clickjacking del
#   panel de plataforma y del panel de staff).
# - CSP: todo sale del mismo origen. `style-src 'unsafe-inline'` lo exige Ionic (inyecta
#   <style> de sus componentes); scripts solo propios. `img-src https:` cubre los logos y
#   fotos de menú de cada marca (URLs externas); `data:` los SVG inline de la landing.
#   `connect-src *.ventea.tech`: el build web de mobile puede apuntar a api.ventea.tech.
# - HSTS 1 año con subdominios: todo `*.ventea.tech` va por HTTPS (Traefik). nginx habla
#   http con Traefik, pero el header llega igual al navegador.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.ventea.tech; media-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
