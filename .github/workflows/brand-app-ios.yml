# App de iOS de una marca (TASK-019). Manual: Actions → «Brand app (iOS)» → slug.
#
# Genera la copia de trabajo de la marca con el mismo generador que Android
# (`npm run brand:app -- --platform ios`) y compila en una Mac de GitHub.
#
# Firma: cada marca es un Environment de GitHub con el nombre de su slug, limitado a la rama
# main («Deployment branches») y con revisores obligatorios, y estos secrets (cuenta de Ventea o
# del cliente, según `publisher`). Sin ellos, build SIN firmar (sirve para validar que compila;
# no se puede subir a App Store Connect).
#   IOS_DIST_CERT_P12_BASE64   certificado «Apple Distribution» (.p12) en base64
#   IOS_DIST_CERT_PASSWORD     contraseña del .p12
#   IOS_PROFILE_BASE64         perfil de aprovisionamiento App Store del bundle id, en base64
#   IOS_TEAM_ID                Team ID de la cuenta de developer
#
# Configuración: por defecto `file` (apps/mobile/brands/brand.<x>.json, versionado). `api` lee
# la plataforma (https://api.ventea.tech, fijo) con VENTEA_PLATFORM_TOKEN, que dura 1 h: se
# carga FRESCO justo antes de disparar (`gh secret set VENTEA_PLATFORM_TOKEN --env <slug>`) y se
# borra al terminar (`gh secret delete …`). Nunca como secret permanente.
name: Brand app (iOS)

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Slug de la marca (carolina-hot-chicken)
        required: true
        type: string
      config_from:
        description: De dónde sale la configuración (api exige un token fresco, ver arriba)
        type: choice
        options: [file, api]
        default: file
      sign:
        description: Firmar y exportar el .ipa si el environment tiene los secrets
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: brand-app-ios-${{ inputs.tenant }}
  cancel-in-progress: false

jobs:
  build:
    name: iOS · ${{ inputs.tenant }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.tenant }}
    env:
      TENANT: ${{ inputs.tenant }}
      WORK: dist-apps/.work/${{ inputs.tenant }}

    steps:
      - name: Validar slug
        run: |
          if ! [[ "$TENANT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Slug inválido: $TENANT"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la marca (config, íconos, Xcode, web, cap sync)
        env:
          VENTEA_PLATFORM_TOKEN: ${{ inputs.config_from == 'api' && secrets.VENTEA_PLATFORM_TOKEN || '' }}
          VENTEA_API_URL: https://api.ventea.tech
          CONFIG_FROM: ${{ inputs.config_from }}
        run: npm run brand:app -- --tenant "$TENANT" --platform ios --config-from "$CONFIG_FROM"

      - name: ¿Hay firma?
        id: signing
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          SIGN: ${{ inputs.sign }}
        run: |
          if [ "$SIGN" = "true" ] && [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secrets de firma en el environment $TENANT: build sin firmar."
          fi

      - name: Build sin firmar
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodebuild build \
            -project "$WORK/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Importar certificado y perfil
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/brand.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - name: Archive y export del .ipa
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          BUNDLE_ID="$(node -p "require('./$WORK/brand.config.json').bundleId")"
          xcodebuild archive \
            -project "$WORK/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "dist-apps/$TENANT/ios"

      - name: Artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-${{ inputs.tenant }}
          path: |
            dist-apps/${{ inputs.tenant }}/ios/*.ipa
            ${{ env.WORK }}/store-listing.md
            ${{ env.WORK }}/icon-1024.png
            ${{ env.WORK }}/brand.config.json
          if-no-files-found: warn
          retention-days: 14

      - name: Borrar el keychain temporal
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/brand.keychain-db" || true
