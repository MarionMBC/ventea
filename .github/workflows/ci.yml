name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ventea
          POSTGRES_PASSWORD: ventea_ci
          POSTGRES_DB: ventea_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ventea"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ventea:ventea_ci@localhost:5432/ventea_test?schema=public
      JWT_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Los scripts de Prisma leen el .env de la raíz vía dotenv-cli, así que en CI
      # hay que materializarlo: sin este archivo, `dotenv -e ../../.env` falla.
      - name: Preparar .env
        run: |
          cat > .env <<EOF
          NODE_ENV=test
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          DEFAULT_TENANT_SLUG=carolina-hot-chicken
          EOF

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run prisma:generate -w @ventea/api

      # Migrar en CI verifica que el historial de migraciones aplica sobre una base
      # vacía. Un `schema.prisma` editado sin su migración correspondiente rompe acá,
      # no en el deploy.
      - name: Aplicar migraciones
        run: npm run prisma:deploy -w @ventea/api

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
